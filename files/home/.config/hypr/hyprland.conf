# Hyprland config managed by SplinterDots.
# Use Dotfiles Center for normal changes: dotctl center

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/dotfiles-generated.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/user.conf

monitor = ,preferred,auto,1

exec-once = ~/.local/bin/dotfiles-hypr-autostart

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland

windowrule = match:class ^(org.gnome.Nautilus)$, float true
windowrule = match:class ^(pavucontrol)$, float true

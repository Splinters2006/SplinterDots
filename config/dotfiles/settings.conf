# Main dotfiles settings.
# Keep this file simple: shell-style KEY="value" assignments only.

DOTFILES_NAME="Arch User"
DOTFILES_EMAIL=""

# Common values: nano, micro, code, vim
DOTFILES_EDITOR="nano"

# Common values: zen-browser, zen-browser, chromium, brave
DOTFILES_BROWSER="zen-browser"

# Common values: dark, light
DOTFILES_THEME="midnight"
DOTFILES_ACCENT="#89b4fa"
DOTFILES_WALLPAPER=""

# Default apps used by the graphical Dotfiles Center.
DOTFILES_TERMINAL="kitty"
DOTFILES_FILE_MANAGER="thunar"
DOTFILES_APP_LAUNCHER="wofi --show drun"

# Quickshell QML bar defaults.
DOTFILES_BAR_POSITION="top"
DOTFILES_BAR_HEIGHT="34"
DOTFILES_BAR_RADIUS="8"
DOTFILES_BAR_OPACITY="0.92"
DOTFILES_BAR_WORKSPACES="left"
DOTFILES_BAR_CLOCK="center"
DOTFILES_BAR_STATUS="right"

# Set to 1 only for VMs or fallback systems where hardware rendering is broken.
DOTFILES_ALLOW_SOFTWARE_RENDERER="0"

# Set to 1 to enable optional prompt integration when starship is installed.
DOTFILES_ENABLE_STARSHIP="1"

# Extra PATH entries, separated by colon.
DOTFILES_EXTRA_PATH="$HOME/.local/bin:$HOME/bin"

# Add aliases here for commands you use constantly.
DOTFILES_ALIAS_LS="eza --icons --group-directories-first"
DOTFILES_ALIAS_CAT="bat"
DOTFILES_UI_FONT="CaskaydiaCove Nerd Font"
DOTFILES_ICON_THEME="Papirus-Dark"
DOTFILES_CURSOR_THEME="Bibata-Modern-Ice"
DOTFILES_BAR_ICON_PACK="nerd"
DOTFILES_BAR_ICON_FONT="Symbols Nerd Font"

# Hyprland config managed by these dotfiles.
# User-friendly changes are written by Dotfiles Center to files sourced below.

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/user.conf

monitor = ,preferred,auto,1

exec-once = ~/.local/bin/dotfiles-hypr-autostart

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $inactive
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, smooth
    animation = workspaces, 1, 4, smooth
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

windowrule = match:class ^(org.gnome.Nautilus)$, float true
windowrule = match:class ^(pavucontrol)$, float true

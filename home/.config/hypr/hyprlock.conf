# SplinterDots lock screen
# Colors come from the SplinterDots theme; these defaults are used until it is saved.
$lock_background = rgba(1e1e2eff)
$lock_surface = rgba(313244ff)
$lock_text = rgba(cdd6f4ff)
$lock_muted = rgba(bac2deff)
$lock_accent = rgba(89b4faff)
$lock_border = rgba(45475aff)
source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    color = $lock_background
}

input-field {
    monitor =
    size = 280, 60
    position = 0, -40
    halign = center
    valign = center
    outer_color = $lock_accent
    inner_color = $lock_surface
    font_color = $lock_text
    check_color = $lock_accent
    fail_color = rgba(f38ba8ff)
    placeholder_text = Enter your password
}

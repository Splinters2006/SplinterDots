# SplinterDots Kitty config

# Use the configured Zsh environment even when the account login shell is Bash.
shell zsh


font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 11.0

background_opacity 0.92
dynamic_background_opacity yes

window_padding_width 8
confirm_os_window_close 0

# Let Hyprland tile new terminals instead of restoring a maximized window.
remember_window_size no

enable_audio_bell no

cursor_shape beam
cursor_blink_interval 0.5

tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/splinter-kitty-{kitty_pid}


# SplinterDots theme override - keep at bottom
include ~/.config/kitty/current-theme.conf

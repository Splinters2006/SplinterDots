# SplinterDots Bluetooth audio.
# Headsets stay on their best playback profile (A2DP, e.g. aptX HD); the bar's
# call mode button (splinter-call-mode) switches to HFP mSBC for calls.
# WirePlumber's own autoswitch is disabled because EasyEffects keeps the mic
# open permanently, which would hold headsets in low-quality call mode.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}

[package]
name = "SplinterDots"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "avif"] }
